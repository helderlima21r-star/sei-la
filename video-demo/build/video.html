<style>

  html,body{ margin:0; width:1920px; height:1080px; overflow:hidden; background:#07060f; font-family:var(--body); color:var(--text); }

  #glowB{ width:800px; height:800px; background:radial-gradient(circle, rgba(92,40,160,.55), rgba(92,40,160,0) 70%); }

    -webkit-mask-image:radial-gradient(ellipse at 50% 50%, #000 20%, transparent 75%); }
  #grain{ position:absolute; inset:0; opacity:.06; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  #fade{ position:absolute; inset:0; background:#000; pointer-events:none; }

  /* intro */
  #intro{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; }
  #introIconWrap{ position:relative; width:220px; height:220px; }
  #introIcon{ width:220px; height:220px; border-radius:52px; box-shadow:0 30px 80px rgba(237,22,80,.35), 0 0 0 1px rgba(255,255,255,.08) inset; }

  #introTag{ font-size:28px; color:var(--dim); font-weight:500; }

  #phoneBody:after{ content:''; position:absolute; left:-4px; top:170px; width:4px; height:60px; border-radius:4px 0 0 4px; background:#2b2640; box-shadow:0 80px 0 #2b2640; }

  .shot{ position:absolute; left:0; top:0; width:390px; }

  .caret{ display:inline-block; width:2px; height:20px; background:var(--pink-mid); margin-left:2px; }

  .eyebrow{ display:inline-flex; align-items:center; gap:12px; font-size:18px; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:var(--pink-mid); }

  .st .bar{ position:absolute; left:23px; top:50px; width:2px; height:calc(100% - 52px); background:var(--line); overflow:hidden; }
  .st .bar i{ position:absolute; left:0; top:0; width:100%; background:var(--pink); }

  /* callouts */

  .callout .lbl i{ width:10px; height:10px; border-radius:50%; background:var(--pink-mid); box-shadow:0 0 12px var(--pink-mid); }

  .callout .zoom img{ position:absolute; left:0; top:0; }
  #links{ position:absolute; inset:0; z-index:15; pointer-events:none; }

  /* recursos */

  #featTitle{ position:absolute; left:0; right:0; top:150px; text-align:center; }

  .fcard{ position:absolute; width:500px; height:220px; border-radius:26px; background:linear-gradient(160deg, rgba(36,29,63,.95), rgba(28,24,50,.95)); border:1px solid var(--line); padding:30px 32px; box-shadow:0 30px 70px rgba(0,0,0,.35); }
  .fcard .ic{ width:56px; height:56px; border-radius:16px; background:var(--pink-bg); border:1px solid var(--pink-line); display:flex; align-items:center; justify-content:center; color:var(--pink-mid); }

  .fcard span{ display:block; font-size:19px; color:var(--dim); margin-top:8px; line-height:1.4; }

  .wm.sky{ color:var(--pink-mid); }
  .wm.lat{ color:var(--text); }
  #outX{ font-size:40px; color:var(--mute); font-weight:300; }
  #outBy{ position:absolute; left:0; right:0; top:900px; text-align:center; font-size:24px; color:var(--mute); letter-spacing:3px; text-transform:uppercase; }
  #outBy b{ font-family:var(--display); font-size:44px; letter-spacing:2px; color:#fff; text-transform:none; margin-left:10px; }
  #outLine{ position:absolute; left:50%; top:690px; width:520px; height:1px; margin-left:-260px; background:linear-gradient(90deg, transparent, var(--line), transparent); }
</style>
</head>

  ['pdf', 'Relatório em PDF', 'Exporta o período do histórico em um clique.'],
  ['phone', 'Instala como app', 'Ícone na tela inicial e abre em tela cheia, como app nativo.'],
  ['users', 'Perfis Equipe e Admin', 'Admin acompanha o painel, edita registros e exporta.'],
  ['clock', 'Horário real de cada entrega', 'Toda pendência resolvida fica com hora e responsável.'],
];

// ================= montagem =================
const shotEls = {};
SEGS.forEach((s) => { const img = el('img', 'shot'); img.src = 'shots/' + s.shot + '.png'; img.style.opacity = 0; $('shots').appendChild(img); shotEls[s.shot] = img; });

// letras do título da abertura
'Conferência'.split('').forEach((c) => $('introTitle').appendChild(el('span', '', c)));

// blocos de texto
COPIES.forEach((c) => {
  const d = el('div', 'copy');
  // tudo entre * fica rosa
  let inPk = false;
  const hw = c.h.split(' ').map((w) => { const s = w.startsWith('*'); if (s) inPk = true; const cls = inPk ? ' pk' : ''; if (w.replace(/[.,]$/, '').endsWith('*')) inPk = false; return `<span class="w${cls}">${w.replace(/\*/g, '')}</span>`; });
  d.innerHTML = `<div class="eyebrow"><span class="num">${c.n}</span>${c.eb}</div><h1>${hw.join(' ')}</h1><p>${c.p}</p>`;
  $('copies').appendChild(d);
  c.el = d;
});

STEPS.forEach(([b, s], i) => {
  const st = el('div', 'st', `<div class="n">${i + 1}</div><div class="tx"><b>${b}</b><span>${s}</span></div>${i < 4 ? '<div class="bar"><i></i></div>' : ''}`);
  $('stepper').appendChild(st);
});

// callouts
CALLS.forEach((c) => {
  const [a, b, shot, r, label, textOnly] = c;
  const box = el('div', 'callout');
  const k = Math.min(1.3, 430 / r[2], 470 / r[3]);
  c.k = k;
  box.innerHTML = `<div class="lbl"><i></i>${label}</div>` + (textOnly ? '' : `<div class="zoom" style="width:${r[2] * k}px;height:${r[3] * k}px;"><img src="shots/${shot}.png" style="width:${390 * k}px;left:${-r[0] * k}px;top:${-r[1] * k}px;"></div>`);
  $('callouts').appendChild(box);
  const hl = el('div', 'hl'); $('overlays').appendChild(hl);
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  line.setAttribute('fill', 'none'); line.setAttribute('stroke', '#ff5f8f'); line.setAttribute('stroke-width', '2'); line.setAttribute('stroke-dasharray', '6 6');
  const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); dot.setAttribute('r', '6'); dot.setAttribute('fill', '#ff5f8f');
  $('links').appendChild(line); $('links').appendChild(dot);
  Object.assign(c, { box, hl, line, dot, textOnly });
});

// toque
const touch = el('div', 'touch'); $('overlays').appendChild(touch);
const ripple = el('div', 'ripple'); $('overlays').appendChild(ripple);

// digitação no login
const tfUser = el('div', 'typefield'); Object.assign(tfUser.style, { left: '32px', top: '374px', width: '326px', height: '52px' });
const tfPass = el('div', 'typefield'); Object.assign(tfPass.style, { left: '32px', top: '465px', width: '280px', height: '52px', borderRight: 'none', borderRadius: '14px 0 0 14px' });
$('overlays').appendChild(tfUser); $('overlays').appendChild(tfPass);

// recursos
FEATS.forEach(([ic, b, s], i) => {
  const d = el('div', 'fcard', `<div class="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[ic]}</svg></div><b>${b}</b><span>${s}</span>`);
  const col = i % 3, row = Math.floor(i / 3);
  d.style.left = (960 - 790 + col * 530) + 'px';
  d.style.top = (440 + row * 250) + 'px';
  $('features').appendChild(d);
  FEATS[i].el = d;
});
['Checklist em 5 etapas', 'Fotos de evidência', 'Pendências rastreadas', 'Painel Admin', 'PDF'].forEach((t) => $('outChips').appendChild(el('div', 'chip', t)));

// ================= cálculo por quadro =================
function scrollOf(seg, t) {
  if (!seg || !seg.scroll) return 0;
  const k = seg.scroll;
  if (t <= k[0][0]) return k[0][1];
  for (let i = 0; i < k.length - 1; i++) {
    if (t <= k[i + 1][0]) return lerp(k[i][1], k[i + 1][1], eIO(prog(t, k[i][0], k[i + 1][0])));
  }
  return k[k.length - 1][1];
}
const segOf = (shot) => SEGS.find((s) => s.shot === shot);

function phonePose(t) {
  // sobe na abertura, flutua, sai para os recursos
  let x = PHONE.cx, y = PHONE.cy, rx = 0, ry = 0, rz = 0, s = 1, o = 1;
  const rise = eOut(prog(t, 4.3, 5.6));
  y += (1 - rise) * 900; rx = (1 - rise) * 30; ry = (1 - rise) * -18; s = lerp(.85, 1, rise);
  o = prog(t, 4.3, 4.6);
  y += Math.sin(t * 0.9) * 5;
  const out = eIn(prog(t, 63.8, 64.6));
  y += out * 1000; rx -= out * 20; rz += out * 6;
  return { x, y, rx, ry, rz, s, o };
}

function render(t) {
  // ---- fundo ----
  $('glowA').style.transform = `translate(${-200 + Math.sin(t * .23) * 160}px, ${-300 + Math.cos(t * .19) * 120}px)`;
  $('glowB').style.transform = `translate(${1300 + Math.cos(t * .17) * 180}px, ${500 + Math.sin(t * .21) * 140}px)`;
  $('glowC').style.transform = `translate(${700 + Math.sin(t * .13) * 300}px, ${200 + Math.cos(t * .11) * 200}px)`;
  $('grid').style.transform = `translate(${(t * 6) % 80}px, ${(t * 4) % 80}px)`;
  $('fade').style.opacity = Math.max(1 - prog(t, 0, .8), prog(t, DUR - 1.0, DUR - .1));

  // ---- abertura ----
  const ic = eBack(prog(t, .4, 1.5));
  const icOut = eIn(prog(t, 4.0, 4.7));
  $('introIconWrap').style.transform = `scale(${lerp(.4, 1, ic) * (1 - icOut * .3)}) rotate(${lerp(-10, 0, ic)}deg) translateY(${-icOut * 120}px)`;
  $('introIconWrap').style.opacity = clamp(prog(t, .4, .9)) * (1 - icOut);
  $('introIcon').style.filter = `blur(${(1 - prog(t, .4, 1.2)) * 16}px)`;
  [['ring1', 1.2], ['ring2', 1.9]].forEach(([id, a]) => { const k = prog(t, a, a + 1.6); const r = $(id); const sz = 220 + eOut(k) * 260; r.style.width = r.style.height = sz + 'px'; r.style.opacity = (k > 0 && k < 1) ? (1 - k) * .8 : 0; });
  [...$('introTitle').children].forEach((sp, i) => { const k = eOut(prog(t, 1.4 + i * .045, 1.95 + i * .045)); sp.style.transform = `translateY(${(1 - k) * 70}px)`; sp.style.opacity = k * (1 - icOut); sp.style.filter = `blur(${(1 - k) * 10}px)`; });
  const bk = eOut(prog(t, 2.2, 2.9)); $('introBadge').style.opacity = bk * (1 - icOut); $('introBadge').style.transform = `translateY(${(1 - bk) * 24 - icOut * 60}px)`;
  const tk = eOut(prog(t, 2.8, 3.5)); $('introTag').style.opacity = tk * (1 - icOut); $('introTag').style.transform = `translateY(${(1 - tk) * 24 - icOut * 60}px)`;
  $('introTitle').style.transform = `translateY(${-icOut * 80}px)`;
  $('intro').style.display = t > 4.8 ? 'none' : 'flex';

  // ---- celular ----
  const P = phonePose(t);
  const ph = $('phone');
  ph.style.display = t > 4.2 && t < 64.8 ? 'block' : 'none';
  ph.style.opacity = P.o;
  ph.style.transform = `translate(${P.x - 207}px, ${P.y - 434}px) perspective(1800px) rotateX(${P.rx}deg) rotateY(${P.ry}deg) rotateZ(${P.rz}deg) scale(${P.s})`;
  const screenX = P.x - 195, screenY = P.y - 422; // canto da tela (sem rotação durante os callouts)

  // telas
  let cur = 0;
  SEGS.forEach((s, i) => { if (t >= s.t) cur = i; });
  SEGS.forEach((s, i) => {
    const img = shotEls[s.shot];
    if (i !== cur && i !== cur - 1) { img.style.opacity = 0; return; }
    const curSeg = SEGS[cur];
    const k = eOut(prog(t, curSeg.t, curSeg.t + .45));
    const sc = scrollOf(s, t);
    let x = 0, o = 1, extra = '', y = -sc;
    if (i === cur) {
      if (curSeg.tr === 'push') x = (1 - k) * 390;
      if (curSeg.tr === 'back') x = -(1 - k) * 120, o = k;
      if (curSeg.tr === 'fade') o = k, extra = ` scale(${lerp(1.04, 1, k)})`;
      if (curSeg.tr === 'rise') o = k, y += (1 - k) * 60;
      img.style.zIndex = curSeg.tr === 'back' ? 1 : 2;
    } else {
      if (k >= 1) { img.style.opacity = 0; return; }
      if (curSeg.tr === 'push') x = -k * 120, o = 1 - k * .5;
      if (curSeg.tr === 'back') x = k * 390;
      if (curSeg.tr === 'fade' || curSeg.tr === 'rise') o = 1 - k * (curSeg.tr === 'rise' ? .5 : 1);
      img.style.zIndex = curSeg.tr === 'back' ? 2 : 1;
    }
    img.style.opacity = o;
    img.style.transform = `translate(${x}px, ${y}px)${extra}`;
  });

  // digitação do login
  const typing = t > 6.3 && t < 10.6;
  tfUser.style.display = tfPass.style.display = typing ? 'flex' : 'none';
  if (typing) {
    const u = 'alex'; const nu = Math.floor(clamp((t - 6.6) / .18, 0, u.length));
    const np = Math.floor(clamp((t - 7.8) / .14, 0, 8));
    const caretOn = Math.floor(t * 2.4) % 2 === 0;
    const onUser = t < 7.6;
    tfUser.className = 'typefield' + (onUser ? ' focus' : '');
    tfPass.className = 'typefield' + (!onUser ? ' focus' : '');
    tfUser.innerHTML = (nu ? u.slice(0, nu) : '<span style="color:#5c6684">Usuário</span>') + (onUser && caretOn ? '<i class="caret"></i>' : '');
    tfPass.innerHTML = (np ? '<span style="letter-spacing:2px">' + '•'.repeat(np) + '</span>' : '<span style="color:#5c6684">Senha</span>') + (!onUser && caretOn ? '<i class="caret"></i>' : '');
  }

  // toque
  let tapShown = false;
  for (let i = 0; i < TAPS.length; i++) {
    const tp = TAPS[i];
    if (t > tp.t - .7 && t < tp.t + .55) {
      tapShown = true;
      const prev = TAPS[i - 1];
      const from = prev && tp.t - prev.t < 2.5 ? prev : { x: tp.x + 70, y: tp.y + 140 };
      const mv = eIO(prog(t, tp.t - .7, tp.t - .15));
      const x = lerp(from.x, tp.x, mv), y = lerp(from.y, tp.y, mv);
      const press = t > tp.t - .08 && t < tp.t + .12 ? .78 : 1;
      touch.style.left = x + 'px'; touch.style.top = y + 'px';
      touch.style.opacity = Math.min(prog(t, tp.t - .7, tp.t - .45), 1 - prog(t, tp.t + .2, tp.t + .55)) * .9;
      touch.style.transform = `scale(${press})`;
      const rk = prog(t, tp.t, tp.t + .5);
      const rs = 20 + rk * 70;
      Object.assign(ripple.style, { left: tp.x - rs / 2 + 'px', top: tp.y - rs / 2 + 'px', width: rs + 'px', height: rs + 'px', opacity: rk > 0 && rk < 1 ? (1 - rk) * .9 : 0 });
      break;
    }
  }
  if (!tapShown) { touch.style.opacity = 0; ripple.style.opacity = 0; }

  // callouts
  const CX = screenX + 390 + 90;
  CALLS.forEach((c) => {
    const [a, b, shot, r] = c;
    const v = inOut(t, a, b, .45, .35);
    const vis = v > 0.001;
    c.box.style.display = c.hl.style.display = vis ? 'block' : 'none';
    c.line.style.display = c.dot.style.display = vis ? 'block' : 'none';
    if (!vis) return;
    const sc = scrollOf(segOf(shot), t);
    const hx = r[0] - 6, hy = r[1] - sc - 6, hw = r[2] + 12, hh = r[3] + 12;
    Object.assign(c.hl.style, { left: hx + 'px', top: hy + 'px', width: hw + 'px', height: hh + 'px', opacity: v });
    const zh = c.textOnly ? 0 : r[3] * c.k;
    const boxH = zh + 56;
    let by = screenY + hy + hh / 2 - boxH / 2;
    by = clamp(by, 70, 1080 - 70 - boxH);
    const slide = (1 - v) * 40;
    c.box.style.left = CX + slide + 'px';
    c.box.style.top = by + 'px';
    c.box.style.opacity = v;
    c.box.style.transform = `scale(${lerp(.94, 1, v)})`;
    c.box.style.filter = `blur(${(1 - v) * 6}px)`;
    // ligação: da borda direita do destaque até o cartão
    const x1 = screenX + hx + hw, y1 = screenY + hy + hh / 2;
    const x2 = CX + slide - 8, y2 = c.textOnly ? by + 22 : by + 56 + zh / 2;
    const draw = eOut(prog(t, a + .1, a + .6));
    const mx = lerp(x1, x2, draw), my = lerp(y1, y2, draw);
    c.line.setAttribute('d', `M${x1},${y1} C${x1 + 40},${y1} ${mx - 40},${my} ${mx},${my}`);
    c.line.style.opacity = v * .9;
    c.dot.setAttribute('cx', x1); c.dot.setAttribute('cy', y1); c.dot.style.opacity = v;
  });

  // textos
  COPIES.forEach((c) => {
    const vis = t > c.a - .05 && t < c.b + .5;
    c.el.style.display = vis ? 'block' : 'none';
    if (!vis) return;
    const out = eIn(prog(t, c.b, c.b + .4));
    const top = c.top != null ? c.top : 540 - c.el.offsetHeight / 2;
    c.el.style.top = top + 'px';
    c.el.style.opacity = 1 - out;
    c.el.style.transform = `translateY(${-out * 30}px)`;
    const eb = c.el.querySelector('.eyebrow'); const ek = eOut(prog(t, c.a, c.a + .5));
    eb.style.opacity = ek; eb.style.transform = `translateX(${(1 - ek) * -30}px)`;
    c.el.querySelectorAll('h1 .w').forEach((w, i) => { const k = eOut(prog(t, c.a + .15 + i * .07, c.a + .7 + i * .07)); w.style.opacity = k; w.style.transform = `translateY(${(1 - k) * 40}px)`; w.style.filter = `blur(${(1 - k) * 10}px)`; });
    const p = c.el.querySelector('p'); const pk = eOut(prog(t, c.a + .5, c.a + 1.1));
    p.style.opacity = pk; p.style.transform = `translateY(${(1 - pk) * 20}px)`;
  });

  // stepper
  const sv = inOut(t, 17.2, 41.3, .6, .4);
  $('stepper').style.display = sv > 0 ? 'flex' : 'none';
  $('stepper').style.opacity = sv;
  [...$('stepper').children].forEach((st, i) => {
    const ik = eOut(prog(t, 17.3 + i * .1, 17.8 + i * .1));
    st.style.opacity = ik; st.style.transform = `translateX(${(1 - ik) * -30}px)`;
    const active = t >= TS[i] && (i === 4 ? t < 41.6 : t < TS[i + 1]);
    const done = i < 4 ? t >= TS[i + 1] : t >= 41.6;
    const n = st.querySelector('.n');
    n.style.background = active ? 'var(--pink)' : done ? 'var(--pink-bg)' : 'var(--ink)';
    n.style.borderColor = active || done ? 'var(--pink)' : 'var(--line)';
    n.style.color = active ? '#fff' : done ? 'var(--pink-mid)' : 'var(--mute)';
    n.style.boxShadow = active ? '0 0 30px rgba(237,22,80,.6)' : 'none';
    n.innerHTML = done && !active ? '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ff5f8f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>' : String(i + 1);
    st.querySelector('.tx b').style.color = active ? '#fff' : done ? 'var(--dim)' : 'var(--mute)';
    st.querySelector('.tx span').style.color = active ? 'var(--dim)' : 'var(--mute)';
    const bar = st.querySelector('.bar i');
    if (bar) bar.style.height = (i < 4 ? prog(t, TS[i], TS[i + 1]) * 100 : 0) + '%';
  });

  // recursos
  const fv = t > 63.9 && t < 71.2;
  $('features').style.display = fv ? 'block' : 'none';
  if (fv) {
    const out = eIn(prog(t, 70.2, 70.9));
    const tk = eOut(prog(t, 64.3, 65.0));
    $('featTitle').style.opacity = tk * (1 - out); $('featTitle').style.transform = `translateY(${(1 - tk) * 30 - out * 30}px)`;
    FEATS.forEach((f, i) => {
      const k = eBack(prog(t, 64.7 + i * .13, 65.3 + i * .13));
      const ko = clamp(prog(t, 64.7 + i * .13, 65.1 + i * .13));
      f.el.style.opacity = ko * (1 - out);
      f.el.style.transform = `translateY(${(1 - k) * 60}px) scale(${lerp(.9, 1, k) * (1 - out * .06)})`;
      const glow = Math.max(0, Math.sin((t - 66 - i * .35) * 1.6)) * .35;
      f.el.style.borderColor = `rgba(255,95,143,${.15 + glow})`;
    });
  }

  // encerramento
  const ov = t > 70.6;
  $('outro').style.display = ov ? 'block' : 'none';
  if (ov) {
    const ik = eBack(prog(t, 70.8, 71.7));
    $('outIcon').style.opacity = clamp(prog(t, 70.8, 71.2)); $('outIcon').style.transform = `scale(${lerp(.5, 1, ik)}) rotate(${(1 - ik) * -12}deg)`;
    const ti = eOut(prog(t, 71.2, 71.9)); $('outTitle').style.opacity = ti; $('outTitle').style.transform = `translateY(${(1 - ti) * 40}px)`; $('outTitle').style.letterSpacing = lerp(18, 1, ti) + 'px';
    const tg = eOut(prog(t, 71.7, 72.3)); $('outTag').style.opacity = tg; $('outTag').style.transform = `translateY(${(1 - tg) * 20}px)`;
    [...$('outChips').children].forEach((c, i) => { const k = eOut(prog(t, 72.1 + i * .1, 72.6 + i * .1)); c.style.opacity = k; c.style.transform = `translateY(${(1 - k) * 20}px)`; });
    const ln = eOut(prog(t, 72.8, 73.6)); $('outLine').style.transform = `scaleX(${ln})`;
    const br = eOut(prog(t, 73.1, 73.8)); $('outBrands').style.opacity = br; $('outBrands').style.transform = `translateY(${(1 - br) * 24}px)`;
    const by = eOut(prog(t, 73.9, 74.6)); $('outBy').style.opacity = by; $('outBy').style.transform = `translateY(${(1 - by) * 20}px)`;
  }
}

window.render = render;
window.DUR = DUR;
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.complete ? 1 : new Promise((r) => { i.onload = i.onerror = r; }))]);
</script>
</body>
